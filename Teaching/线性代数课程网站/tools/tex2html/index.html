<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TeX → 知识页 · 线性代数转换工作台</title>
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="converter.css">
  <script defer src="core.js"></script><script defer src="zip.js"></script><script defer src="app.js"></script>
  <script defer src="../../js/mathjax-config.js"></script><script defer src="../../assets/vendor/mathjax/tex-svg.js"></script>
</head>
<body>
  <header class="app-header"><a class="brand" href="../../index.html"><span class="brand-icon">T<span>↗</span></span><span>TeX <b>→</b> 知识页</span></a><span id="status" class="header-status" role="status">准备就绪</span><div class="header-actions"><span class="local-badge"><i></i> 本地处理</span><a href="README.md" target="_blank">使用说明</a><div class="theme-toggle global-theme-toggle" aria-label="页面主题"><button id="theme-light" aria-pressed="true">明亮</button><button id="theme-dark" aria-pressed="false">暗色</button></div><div class="header-output-group" aria-label="结果输出"><span class="header-output-label">结果输出</span><div class="header-output-buttons"><button id="write-site" class="primary header-output-button" title="选择课程网站根目录；已有 css/tex2html.css 会保留，图形保存到 assets/chapterXX/"><span class="header-output-mark" aria-hidden="true">写入</span><span><strong>写入网站源</strong><small>content/ · assets/chapterXX/</small></span></button><button id="export-zip" class="header-output-button" title="下载包含 HTML、CSS、SVG 和 TeX 源码的课程网站文件包"><span class="header-output-mark" aria-hidden="true">ZIP</span><span><strong>导出结果包</strong><small>HTML · CSS · SVG · TeX</small></span></button></div></div></div></header>
  <main class="workspace">
    <section class="panel input-panel" aria-labelledby="input-heading"><div class="panel-title input-toolbar"><h2 id="input-heading">TeX 输入</h2><div class="input-title-actions"><button id="import-tex">+tex</button><button id="import-sty">+sty</button><button id="import-images">+pic</button></div><div class="source-frame-row"><div class="lecture-source"><div class="field"><select id="lecture-tex-select" aria-label="选择讲稿 TeX 文件"><option value="">ppt</option></select></div></div><details class="frame-picker"><summary id="lecture-frame-summary">frames</summary><div class="frame-picker-body"><div id="lecture-frames"><p class="muted">frames</p></div></div></details><button class="primary source-convert" id="convert-all">转换</button></div></div>
      <div class="file-line"><label for="file-select">当前文件</label><select id="file-select"></select></div>
      <div class="lecture-code-preview scroll-activate" data-code-theme="light" tabindex="0" aria-label="TeX 代码，点击后启用滚动"><div class="lecture-code-title"><span>TeX 代码</span><div class="code-theme-toggle" aria-label="TeX 代码主题"><button type="button" data-code-theme="light" aria-pressed="true">浅色</button><button type="button" data-code-theme="dark" aria-pressed="false">深色</button><button type="button" data-code-theme="sepia" aria-pressed="false">护眼</button></div></div><pre id="lecture-tex-preview">选 tex 文件</pre></div>
      <div class="search-line"><input id="source-search" type="search" placeholder="搜索正文或 \\命令" aria-label="输入内容搜索"><button id="find-source">查找</button></div>
      <div class="editor"><pre id="line-numbers" aria-hidden="true">1</pre><textarea id="tex-input" aria-label="TeX 源代码" spellcheck="false" wrap="off"></textarea></div>
      <div class="editor-footer"><span id="source-info">UTF-8</span><div><button id="paste-tex" class="quiet">粘贴 TeX</button><button id="clear-tex" class="quiet">清空</button></div></div>
      <div class="source-actions"><button id="insert-break">插入分页分隔线</button><button id="selection-page">选中内容独立成页</button></div>
      <details class="file-details"><summary>已导入文件与最近记录 <span id="file-count"></span></summary><div id="file-list"></div><div id="recent-files"></div></details>
    </section>
    <section class="panel rules-panel rules-panel-collapsed" aria-labelledby="rules-heading"><div class="panel-title panel-toggle" id="toggle-rules" role="button" tabindex="0" aria-expanded="false" aria-labelledby="rules-heading"><h2 id="rules-heading">转换规则</h2><div class="rules-title-actions"><button id="reset-rules" class="quiet">重置</button></div></div>
      <div class="rule-tabs"><button class="active" data-rule-tab="rules">规则</button><button data-rule-tab="macros">自定义命令</button><button data-rule-tab="styles">样式</button></div>
      <div class="rule-body" id="rules-content"></div><div class="convert-footer"><label class="check"><input id="auto-preview" type="checkbox" checked> 修改后自动转换</label></div>
    </section>
    <section class="panel output-panel" aria-labelledby="output-heading"><div class="panel-title"><h2 id="output-heading">结果预览</h2><div class="output-title-tools"><div class="stats"><span><b id="stat-frames">0</b>frames</span><span><b id="stat-pages">0</b>知识页</span><span><b id="stat-warnings">0</b>待检查</span></div><div class="page-toolbar"><select id="page-select" aria-label="选择预览范围"></select></div></div></div>
      <div class="output-tabs" role="tablist" aria-label="结果类型"><button class="active" data-view="preview" role="tab" aria-selected="true">页面</button><button data-view="html" role="tab" aria-selected="false">HTML</button><button data-view="css" role="tab" aria-selected="false">CSS</button><button data-view="json" role="tab" aria-selected="false">JSON</button><button data-view="svg" role="tab" aria-selected="false">图形</button><button data-view="warnings" role="tab" aria-selected="false">警告 <span id="warning-badge">0</span></button><button data-view="log" role="tab" aria-selected="false">日志</button></div>
      <div id="output" class="output-content scroll-activate" tabindex="0" aria-label="结果预览，点击后启用滚动" aria-live="polite"></div>
    </section>
    <section class="panel command-reference-panel command-reference-collapsed" aria-labelledby="command-reference-heading"><div class="panel-title panel-toggle" id="toggle-command-reference" role="button" tabindex="0" aria-expanded="false" aria-labelledby="command-reference-heading"><h2 id="command-reference-heading">TeX 命令与符号处理说明</h2><span id="command-reference-count" class="muted"></span></div><div class="command-reference-toolbar"><input id="command-reference-search" type="search" placeholder="搜索命令或处理方式" aria-label="搜索 TeX 命令或处理方式"><span class="muted">统计当前已加载的课程 TeX</span></div><div id="command-reference" class="command-reference-content"><p class="muted">选择 TeX 文件后自动生成。</p></div></section>
  </main>
  <dialog id="edit-dialog"><form method="dialog"><div class="dialog-heading"><h2 id="dialog-title">编辑</h2><button value="cancel" aria-label="关闭">×</button></div><div id="dialog-body"></div><div class="dialog-actions"><button value="cancel">取消</button><button id="dialog-save" class="primary" value="save">保存</button></div></form></dialog>
  <input id="file-picker" type="file" hidden><input id="config-picker" type="file" accept="application/json,.json" hidden>
  <noscript><p>转换器需要启用 JavaScript。课程正文网站仍可独立访问。</p></noscript>
</body></html>
