<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" fill="none">
  <title>平面上的向量加法</title>
  <desc>按相同尺度绘制向量 u=(3,1)、v=(1,3) 及其和 (4,4)。</desc>
  <defs>
    <pattern id="grid" x="118" y="70" width="62" height="62" patternUnits="userSpaceOnUse"><path d="M62 0H0V62" stroke="#dbe5ef" stroke-width="1"/></pattern>
    <marker id="green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#2f668f"/></marker>
    <marker id="blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#667b91"/></marker>
    <marker id="dark" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#26364a"/></marker>
  </defs>
  <rect x="32" y="8" width="536" height="420" fill="url(#grid)"/>
  <path d="M118 318 304 256 366 70 180 132Z" fill="#2f668f" fill-opacity=".055"/>
  <path d="M35 318H551M118 412V19" stroke="#a4b9ce" stroke-width="1.3"/>
  <path d="m546 313 6 5-6 5m-433-299 5-6 5 6" stroke="#a4b9ce" stroke-width="1.3"/>
  <path d="m304 256 62-186m-186 62 186-62" stroke="#89a4bf" stroke-width="1.5" stroke-dasharray="5 6"/>
  <path d="m118 318 62-186" stroke="#667b91" stroke-width="2.5" marker-end="url(#blue)"/>
  <path d="m118 318 186-62" stroke="#2f668f" stroke-width="2.5" marker-end="url(#green)"/>
  <path d="m118 318 248-248" stroke="#26364a" stroke-width="2.5" marker-end="url(#dark)"/>
  <circle cx="118" cy="318" r="4" fill="#26364a"/>
  <g font-family="Georgia, serif" font-size="26" font-style="italic"><text x="280" y="290" fill="#2f668f">u</text><text x="150" y="130" fill="#667b91">v</text><text x="381" y="75" fill="#26364a">u + v</text></g>
  <g font-family="Georgia, serif" font-size="22" fill="#6c7e95"><text x="98" y="343">0</text><text x="544" y="345" font-style="italic">x</text><text x="135" y="29" font-style="italic">y</text></g>
</svg>
