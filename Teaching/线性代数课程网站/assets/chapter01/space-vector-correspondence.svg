<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" fill="none">
  <title>空间中的点与向量一一对应</title>
  <desc>固定原点 O 后，空间中的点 P 与从 O 指向 P 的向量一一对应。</desc>
  <rect width="720" height="170" rx="8" fill="#f0f4ef"/>
  <g fill="#fff" stroke="#dce3db"><rect x="54" y="62" width="210" height="74" rx="7"/><rect x="456" y="62" width="210" height="74" rx="7"/></g>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" fill="#23352f" text-anchor="middle"><text x="159" y="88" font-size="22">空间中的点</text><text x="561" y="88" font-size="22">空间向量</text></g>
  <g font-family="Georgia,serif" font-size="22" font-style="italic" fill="#24594b" text-anchor="middle"><text x="159" y="124">P</text><text x="561" y="124">OP →</text></g>
  <g fill="#24594b" font-family="Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="360" y="42" font-size="22">固定原点 O</text><text x="360" y="111" font-size="32">↔</text></g>
</svg>
