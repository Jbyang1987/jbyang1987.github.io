<svg xmlns="http://www.w3.org/2000/svg" width="720" height="170" viewBox="0 0 720 170" fill="none">
  <title>空间中的点与向量一一对应</title>
  <desc>固定原点 O 后，空间中的点 P 与从 O 指向 P 的向量一一对应。</desc>
  <rect width="720" height="170" rx="8" fill="#eef4fb"/>
  <g fill="#fff" stroke="#d6e1ee"><rect x="54" y="62" width="210" height="74" rx="7"/><rect x="456" y="62" width="210" height="74" rx="7"/></g>
  <g font-family="Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" fill="#26364a" text-anchor="middle"><text x="159" y="88" font-size="22">空间中的点</text><text x="561" y="88" font-size="22">空间向量</text></g>
  <g font-family="Georgia,serif" font-size="22" font-style="italic" fill="#2f5f8f" text-anchor="middle"><text x="159" y="124">P</text><text x="561" y="124">OP →</text></g>
  <g fill="#2f5f8f" font-family="Segoe UI,PingFang SC,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="360" y="42" font-size="22">固定原点 O</text><text x="360" y="111" font-size="32">↔</text></g>
</svg>
