<div class="tex-converted tex-page-6-7-3-lesson-6-7-3" data-chapter="6" data-chapter-id="00 introduction.tex::section6">
  <p class="tex-hierarchy">线性空间 / 线性方程组解集的结构</p>
  <!-- 以下内容由所选 TeX frame 转换而来。 -->
  <!-- TeX block: definition -->
  <fieldset class="math-block math-block-definition math-block-framed">
    <legend class="math-block-heading"><span class="math-block-heading-name"><span class="math-block-label">定义</span></span> <span class="math-block-title">（基础解系）</span></legend>
    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">设\(A\in {\mathbb F}^{m\times n}\). 称解空间<small class="tex-footnote">\(V\)也称为矩阵\(A\)的<span class="tex-color-blue">零空间</span>，记为<span class="tex-color-blue">\(N(A)\)</span>.</small></div>

      <!-- TeX block: formula -->
      <div class="tex-display">\[V=\{X\in {\mathbb F}^n\mid AX=0\}\]</div>

      <!-- TeX block: text -->
      <div class="tex-paragraph">的一组基为齐次线性方程组\(AX=0\)的一个<span class="tex-color-blue">基础解系</span>.</div>
    </div>
  </fieldset>

  <!-- TeX block: theorem -->
  <fieldset class="math-block math-block-theorem math-block-framed">
    <legend class="math-block-heading"><span class="math-block-heading-name"><span class="math-block-label">定理</span></span> <span class="math-block-title">（解空间大小）</span></legend>
    <div class="math-block-body">
      <!-- TeX block: formula -->
      <div class="tex-display">\[\dim(V) = n-\operatorname{rank}(A).\]</div>
    </div>
  </fieldset>
</div>
