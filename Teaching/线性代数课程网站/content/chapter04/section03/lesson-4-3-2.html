      <!-- TeX block: text -->
      <div class="tex-paragraph">设\(A\)为\(n\)阶方阵. 则以下几条等价</div>

      <ol>
        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">\(A\)可逆(i.e. 存在\(X\)使得\(AX=I=XA\).);</div>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">\(\det(A)\neq0\);</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">存在\(X\)使得\(I=XA\);</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">存在\(X\)使得\(AX=I\).</div>
        </li>
      </ol>

      <!-- TeX block: text -->
      <div class="tex-paragraph">若以上几条成立,则\(A^{-1}=\frac1{\det(A)}A^*\).</div>
