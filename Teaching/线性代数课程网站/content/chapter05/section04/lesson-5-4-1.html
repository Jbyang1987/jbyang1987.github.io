      <!-- TeX block: text -->
      <div class="tex-paragraph">称两矩阵\(A,B\) <span class="tex-color-blue">相抵</span>,若存在可逆矩阵\(P\)和\(Q\)使得</div>

      <!-- TeX block: formula -->
      <div class="tex-display">\[B=PAQ.\]</div>
    </div>

  <!-- TeX block: text -->
  <div class="tex-paragraph">注:因可逆矩阵为方阵,因此要使\(B=PAQ\)成立, \(B\)和\(A\)的行列数必须一致.</div>

  <!-- TeX block: proposition -->
  <section class="math-block math-block-proposition">
    <div class="math-block-heading"><span class="math-block-label">性质</span> <span class="math-block-number">5.1.2</span> <span class="math-block-title">相抵的基本性质</span></div>
    <div class="math-block-body">
      <!-- TeX block: list -->
      <ol>
        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">任意矩阵与自身相抵;</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">若\(A\)与\(B\)相抵,则\(B\)与\(A\)也相抵;</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">若\(A\)与\(B\)相抵且\(B\)与\(C\)相抵,则\(A\)与\(C\)相抵.</div>
        </li>
      </ol>
    </div>
  </section>

  <!-- TeX block: text -->
  <div class="tex-paragraph">满足上述三条性质的关系称为<span class="tex-color-blue">等价关系</span>。换句话说，上述性质表明相抵为等价关系.</div>
