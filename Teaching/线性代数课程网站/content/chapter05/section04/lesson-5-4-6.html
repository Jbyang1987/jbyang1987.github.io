    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">若矩阵\(A\)至少有一个\(r\)阶非零子式,且\(A\)的所有\(r+1\)阶子式都为零,则\(\operatorname{rank}(A)=r\).</div>
