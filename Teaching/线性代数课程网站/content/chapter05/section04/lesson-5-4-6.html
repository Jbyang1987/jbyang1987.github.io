  <!-- 以下内容由所选 TeX frame 转换而来。 -->

    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">设\(A\in F^{m\times n}\), \(P\), \(Q\)分别为\(m\), \(n\)阶初等方阵.若\(A\)的\(k\)阶子式全为零,则\(PA\)和\(AQ\)的所有\(k\)阶子式全为零.</div>
    </div>
  </fieldset>

  <!-- TeX block: proposition -->
  <fieldset class="math-block math-block-proposition math-block-framed">
    <legend class="math-block-heading"><span class="math-block-heading-name"><span class="math-block-label">性质</span></span> <span class="math-block-title">（通过子式定义秩）</span></legend>
    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">若矩阵\(A\)至少有一个\(r\)阶非零子式,且\(A\)的所有\(r+1\)阶子式都为零,则\(\operatorname{rank}(A)=r\).</div>
