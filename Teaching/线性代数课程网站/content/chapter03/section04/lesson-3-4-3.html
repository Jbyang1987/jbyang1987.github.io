  <!-- 以下内容由所选 TeX frame 转换而来。 -->

    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">若\(X\)和\(Y\)都为\(A\)的逆矩阵,则\(X=Y\).</div>
    </div>

  <!-- TeX block: proposition -->
  <fieldset class="math-block math-block-proposition math-block-framed">
    <legend class="math-block-heading"><span class="math-block-heading-name"><span class="math-block-label">性质</span></span> <span class="math-block-title">（逆矩阵的基本性质）</span></legend>
    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">设\(A\)和\(B\)为同阶可逆方阵, \(\lambda\)为非零常数.  则</div>

      <!-- TeX block: list -->
      <ol>
        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">\((A^{-1})^{-1}=A\);</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">\((\lambda A)^{-1}=\lambda^{-1}A^{-1}\);</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">\((AB)^{-1}=B^{-1}A^{-1}\)(穿脱原理).</div>
        </li>
      </ol>
