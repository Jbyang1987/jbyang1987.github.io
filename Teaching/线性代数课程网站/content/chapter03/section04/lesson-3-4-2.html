  <p class="tex-hierarchy">矩阵(一) / 逆矩阵</p>
  <!-- 以下内容由所选 TeX frame 转换而来。 -->
  <!-- TeX block: definition -->
  <fieldset class="math-block math-block-definition math-block-framed">
    <legend class="math-block-heading"><span class="math-block-heading-name"><span class="math-block-label">定义</span></span> <span class="math-block-title">（逆矩阵）</span></legend>
    <div class="math-block-body">
      <!-- TeX block: text -->
      <div class="tex-paragraph">设\(A\)为数域\({\mathbb F}\)上的\(n\)阶方阵.如果存在\(n\)阶方阵\(X\)满足</div>

      <!-- TeX block: formula -->
      <div class="tex-display">\[XA=I=AX\]</div>

      <!-- TeX block: text -->
      <div class="tex-paragraph">则称\(A\) <span class="tex-color-blue">可逆</span>,并称\(X\)为\(A\)的<span class="tex-color-blue">逆矩阵</span>.记做\(A^{-1}\).</div>
    </div>
  </fieldset>

  <!-- TeX block: text -->
  <div class="tex-paragraph"><span class="tex-color-blue">奇异方阵,非奇异方阵</span></div>

  <!-- TeX block: text -->
  <div class="tex-paragraph"><span class="tex-color-blue">注:</span> 若\(A\in {\mathbb F}^{m\times n}\)不为方阵,则一定<span class="tex-color-blue">不存在</span>矩阵\(X\in {\mathbb F}^{n\times m}\)使得</div>

  <!-- TeX block: formula -->
  <div class="tex-display">\[AX = I_m \quad \text{且}\quad  XA=I_n.\]</div>

  <!-- TeX block: text -->
  <div class="tex-paragraph">这也是我们为什么不考虑非方阵的逆.</div>
</div>
