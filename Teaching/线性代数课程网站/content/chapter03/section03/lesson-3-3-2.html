      <div class="tex-paragraph">映射\(f\)保持两边的加法和乘法.  即, 对任意 \(z_1=x_1+iy_1\), \(z_2=x_2+iy_2\)</div>

      <!-- TeX block: list -->
      <ul>
        <!-- TeX block: list-item -->

          <!-- TeX block: text -->
          <div class="tex-paragraph">\(f(z_1+z_2)=f(z_1)+f(z_2)\);</div>
        </li>

        <!-- TeX block: list-item -->
        <li>
          <!-- TeX block: text -->
          <div class="tex-paragraph">\(f(z_1z_2)=f(z_1)f(z_2)\).</div>
        </li>
