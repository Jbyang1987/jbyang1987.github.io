<div class="teaching-block"><h3>思考 · 用少数几个向量，描述哪些位置？</h3><p>从给定的一组向量出发，只使用加法和数乘，可以得到什么？这些向量中，是否有某个方向其实是多余的？这分别引出线性组合与线性相关性。</p></div>
<div class="teaching-block definition lecture-topic" id="linear-combinations"><h3>定义 · 线性组合</h3><p>设 \(\vec a_1,\ldots,\vec a_m\) 是一组向量，\(\lambda_1,\ldots,\lambda_m\in\mathbb R\)。向量</p><div class="formula">\[\lambda_1\vec a_1+\lambda_2\vec a_2+\cdots+\lambda_m\vec a_m\]</div><p>叫作这组向量的一个<strong>线性组合</strong>。也就是说，它是从这组向量出发，通过线性运算得到的向量。</p><figure class="lecture-figure" tabindex="0" role="region" aria-label="三个线性组合的几何图，可横向滚动"><img src="../assets/chapter01/linear-combinations.svg" width="720" height="340" alt="讲稿示意图：从 a 与 b 出发，取三组不同系数，分别得到 0.8a+2b、-1.5a+0.6b、-0.2a-b，终点都在同一个平面上。"><figcaption>同样两个起始向量，改变系数就得到平面中的不同终点。</figcaption></figure></div>
