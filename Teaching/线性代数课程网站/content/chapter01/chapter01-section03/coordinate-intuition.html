<div class="teaching-block"><h3>思考 · 坐标轴一定要互相垂直吗？</h3><p>笛卡尔坐标系中，坐标轴互相垂直。为了允许斜交的坐标轴，需要先回答：什么样的三个向量，能唯一表示空间中的每个向量？</p></div>
<div class="teaching-block"><h3>几何 · 三个不共面的方向</h3><p>两个不共线的方向只覆盖一个平面。加入第三个不在该平面内的方向，就能走出这个平面。三个方向不需要正交，长度也不需要等于 1。</p><figure class="lecture-figure" tabindex="0" role="region" aria-label="正交轴与仿射基比较图，可横向滚动"><img src="../assets/chapter01/affine-coordinates.svg" width="720" height="320" alt="讲稿示意图：左侧画出三维正交坐标轴，右侧画出三个不相互垂直的基向量 e1、e2、e3，它们都从原点 O 出发。"><figcaption>按讲稿绘制的两套三维坐标方向。斜交的三根轴也可以作为一组基。</figcaption></figure></div>
