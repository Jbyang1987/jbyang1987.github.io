<div class="teaching-block definition lecture-topic" id="linear-independence">
          <h3>定义 · 线性相关与线性无关</h3>
          <p>若存在<strong>不全为零</strong>的实数 \(\lambda_1,\ldots,\lambda_m\)，使得</p><div class="formula">\[\lambda_1\vec a_1+\cdots+\lambda_m\vec a_m=\vec0,\]</div>
          <p>则称向量组<strong>线性相关</strong>。否则称为<strong>线性无关</strong>：任意不全为零的系数都不能使组合等于零向量。等价地，组合等于零向量时，只能有 \(\lambda_1=\cdots=\lambda_m=0\)。</p>
          <p class="lecture-note">“不全为零”是至少有一个系数非零，不是要求每一个系数都非零。</p>
        </div>
