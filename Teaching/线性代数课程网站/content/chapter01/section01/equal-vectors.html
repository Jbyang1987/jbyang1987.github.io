<div class="teaching-block definition"><h3>相等看大小与方向</h3><p>具有相同大小与方向的有向线段表示相等的向量。平移箭头不改变向量。</p></div><p>本章讨论的几何向量不固定在某个起点上。同一个向量可以画在不同位置；比较时，可以把两个箭头平移到同一起点。</p><p>只有长度相同还不够，方向也必须相同。</p><div class="check"><h3>想一想</h3><p>两个箭头长度相等，其中一个向东，另一个向北。它们表示相等的向量吗？</p><details><summary>查看答案与解释</summary><p>不相等，因为方向不同。如果两个箭头都向东且长度相等，即使起点不同，也表示相等的向量。</p></details></div>
