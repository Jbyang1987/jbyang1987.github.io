<div class="teaching-block"><h3>零向量</h3><p>零向量 \(\vec0\) 的模长为 0。按讲稿约定，任意方向都视为零向量的方向，因此它与任意向量平行；它本身没有唯一确定的方向。</p></div><div class="teaching-block"><h3>单位向量</h3><p>模长为 1 的向量叫作单位向量。不同方向可以有不同的单位向量。</p></div><div class="teaching-block"><h3>负向量</h3><p>与非零向量 \(\vec a\) 大小相同、方向相反的向量记为 \(-\vec a\)。零向量的负向量仍是零向量。</p></div><div class="check"><h3>想一想</h3><p>一个向量的模长为 1，它的负向量还是单位向量吗？</p><details><summary>查看答案与解释</summary><p>是。取负向量只改变方向，模长仍为 1。</p></details></div>
