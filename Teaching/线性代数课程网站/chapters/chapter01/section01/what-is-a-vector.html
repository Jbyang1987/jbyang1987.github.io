    <header class="knowledge-intro"><h1 class="knowledge-page-title"><span class="knowledge-page-number">§1.1.1</span><span>什么是向量？</span></h1><p class="knowledge-goal">从速度、位移和力认识大小、方向与向量记号。</p></header>
    <article class="lesson knowledge-lesson"><div class="teaching-block" id="what-is-a-vector"><p>我们熟悉的速度、位移和力，都既有大小，又有方向。把这些共同特征抽象出来，就得到本章首先讨论的<strong>几何向量</strong>。向量可以写成 \(\overrightarrow{AB}\) 或 \(\vec a\)，其模长记作 \(|\vec a|\)。</p><div class="source-figures vector-example-figures" aria-label="讲稿中的三张向量实例原图">
            <figure><img src="../../../assets/chapter01/velocity.jpg" width="119" height="60" alt="讲稿原图：行星周围的飞行物沿轨迹运动，标示逃逸速度。"><figcaption>速度</figcaption></figure>
            <figure><img src="../../../assets/chapter01/displacement.png" width="124" height="50" alt="讲稿原图：从起点 A 指向终点 B 的蓝色位移箭头。"><figcaption>位移</figcaption></figure>
            <figure><img src="../../../assets/chapter01/force.png" width="140" height="42" alt="讲稿原图：小车的拉力和推力分别沿斜向上、斜向下方向作用。"><figcaption>力</figcaption></figure>
          </div></div><div class="check"><h3>想一想</h3><p>只知道汽车的速度大小是每小时 60 千米，能确定它的速度向量吗？</p><details><summary>查看答案与解释</summary><p>不能。还需要知道运动方向。向量同时包含大小和方向。</p></details></div>
</article>
