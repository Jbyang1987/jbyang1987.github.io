e-intro"><h1 class="knowledge-page-title"><span class="knowledge-page-number">§1.3.1</span><span>坐标轴一定要互相垂直吗？</span></h1><p class="knowledge-goal">从空间中的点、向量和仿射坐标系开始。</p></header><article class="lesson knowledge-lesson"><div class="teaching-block"><h3>思考 · 坐标轴一定要互相垂直吗？</h3><p>笛卡尔坐标系中，坐标轴互相垂直。为了允许斜交的坐标轴，需要先回答：什么样的三个向量，能唯一表示空间中的每个向量？</p></div>
<div class="teaching-block"><h3>几何 · 三个不共面的方向</h3><p>两个不共线的方向只覆盖一个平面。加入第三个不在该平面内的方向，就能走出这个平面。三个方向不需要正交，长度也不需要等于 1。</p><figure class="lecture-figure" tabindex="0" role="region" aria-label="正交轴与仿射基比较图，可横向滚动"><img src="../../../assets/chapter01/affine-coordinates.svg" width="720" height="320" alt="讲稿示意图：左侧画出三维正交坐标轴，右侧画出三个不相互垂直的基向量 e1、e2、e3，它们都从原点 O 出发。"><figcaption>按讲稿绘制的两套三维坐标方向。斜交的三根轴也可以作为一组基。</figcaption></figure></div></article><div class="unit-completion"><button class="button button-primary" type="button" data-unit-complete="chapter01-section03-coordinate-intuition" data-unit-label="本页" disabled>标记本页为已学会</button><p class="completion-message" data-unit-message="chapter01-section03-coordinate-intuition" role="status" aria-live="polite"></p><p class="completion-next" data-next-unlearned="chapter01-section03-coordinate-intuition" aria-live="polite"></p></div><nav class="page-navigation" aria-label="前后翻页"><a href="index.html"><span> 返回本节目录</span><strong>1.3 坐标系、坐标与坐标变换</strong></a><a href="affine-basis.html" rel="next"><span>下一页</span><strong>什么是仿射坐标系？</strong></a></nav><div class="reading-options"><a href="index.html#part-coordinate-intuition">整节阅读</a><a href="../../chapter01.html">整章阅读</a></div></main></div><footer class="site-footer page-width"><span>版权所有 © 线性代数课程</span></footer></body></html>
